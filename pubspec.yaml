name: colognecraftapp
description: "A professional hybrid shopping app for CologneCraft."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.6

dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_size: 26

flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"
    icon_background_color: "#000000"